<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Цифровой дождь — CODE_MUM</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06100d}canvas{display:block;width:100%;height:100%;touch-action:pan-y}</style></head><body><canvas id="canvas"></canvas><script>
(()=>{
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{alpha:false});
const params=new URLSearchParams(location.search),light=params.get('theme')==='light';
const quality=Math.max(.45,Math.min(1,Number(params.get('quality'))||1)),fps=Math.max(15,Math.min(60,Number(params.get('fps'))||60));
const plain=params.get('plain')==='1';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const bg=light?'#f3f2ed':'#06100d',rain=light?'#386f60':'#338968',bright=light?'#125d4d':'#c0ffe0';
const alphabet='0123456789アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン';
let w=0,h=0,dpr=1,cell=14,cols=[],glyphs=[],last=0,accum=0,elapsed=0,mask=null,maskW=0,maskH=0,outline=[],smallText=[],sparkles=[];
function rnd(n){return Math.random()*n}
function resize(){
 w=innerWidth;h=innerHeight;
 dpr=Math.min(devicePixelRatio||1,1.6)*quality;
 canvas.width=Math.max(1,Math.round(w*dpr));canvas.height=Math.max(1,Math.round(h*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);
 cell=Math.max(11,Math.min(17,Math.floor(w/31)));
 cols=Array.from({length:Math.ceil(w/cell)+1},(_,i)=>({x:i*cell,y:rnd(h),speed:25+rnd(80),length:6+Math.floor(rnd(13)),chars:Array.from({length:23},()=>alphabet[Math.floor(rnd(alphabet.length))])}));
 if(!plain)buildText();
}
function buildText(){
 const off=document.createElement('canvas');off.width=Math.ceil(w/cell)+2;off.height=Math.ceil(h/cell)+2;const m=off.getContext('2d',{willReadFrequently:true});
 const cw=off.width,ch=off.height;m.clearRect(0,0,cw,ch);
 const mobile=w<680,small=w<380;
 const lines=mobile?['ЗА ГРАНЬЮ','КОДА']:['ЗА ГРАНЬЮ КОДА'];
 const maxWidth=Math.floor(cw*.88),maxSize=mobile?Math.min(10,Math.floor(maxWidth/7)):Math.min(12,Math.floor(maxWidth/13));
 let size=Math.max(4,maxSize);
 m.textAlign='center';m.textBaseline='middle';m.lineJoin='round';
 while(size>3){m.font='900 '+size+'px Arial, sans-serif';if(lines.every(t=>m.measureText(t).width<=maxWidth))break;size-=.3}
 const mid=Math.round(ch*(mobile?.36:.43)),step=Math.ceil(size*1.5);
 m.font='900 '+size+'px Arial, sans-serif';m.strokeStyle='#fff';m.lineWidth=4; // 2 grid cells on either side of the contour
 for(let i=0;i<lines.length;i++)m.strokeText(lines[i],cw/2,mid+(i-(lines.length-1)/2)*step);
 const data=m.getImageData(0,0,cw,ch).data;outline=[];
 for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){if(data[(y*cw+x)*4+3]>120)outline.push({x,y,phase:rnd(6.28),char:alphabet[Math.floor(rnd(alphabet.length))]})}
 smallText=[];
 const labels=mobile?['РАЗРАБОТКА САЙТОВ','МОБИЛЬНЫЕ ПРИЛОЖЕНИЯ','ДИЗАЙН И АНИМАЦИЯ']:['РАЗРАБОТКА САЙТОВ   •   МОБИЛЬНЫЕ ПРИЛОЖЕНИЯ','ИСКУССТВЕННЫЙ ИНТЕЛЛЕКТ   •   ДИЗАЙН И АНИМАЦИЯ'];
 labels.forEach((t,i)=>{const chars=[...t],maxChars=Math.max(1,Math.floor(cw*.9)),chunks=[];for(let k=0;k<chars.length;k+=maxChars)chunks.push(chars.slice(k,k+maxChars));chunks.forEach((part,j)=>{const y=Math.floor(ch*(mobile?.60:.63))+(i*2+j)*2;const x=Math.max(0,Math.floor((cw-part.length)/2));part.forEach((ch,k)=>{if(ch!==' ')smallText.push({x:x+k,y,char:ch})})})});
}
function render(now){
 requestAnimationFrame(render);
 if(document.hidden)return;
 if(now-last<1000/fps-1)return;
 const dt=Math.min(.05,last?(now-last)/1000:0);last=now;elapsed+=dt;
 ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='500 '+Math.floor(cell*.88)+'px monospace';
 const reveal=reduced?1:Math.min(1,Math.max(0,(elapsed-.4)/2.2));
 const maxColumns=cols.length;
 for(let ci=0;ci<maxColumns;ci++){
 const c=cols[ci];if(!reduced)c.y+=c.speed*dt*(.55+quality*.45);if(c.y-c.length*cell>h)c.y=-rnd(h*.5);
 const count=Math.min(c.length,Math.ceil(c.y/cell)+1);
 for(let j=0;j<count;j++){const y=c.y-j*cell;if(y<0||y>h)continue;const alpha=(1-j/c.length)*(.36+.52*quality);ctx.fillStyle=light?'rgba(15,111,77,'+alpha+')':'rgba(93,255,166,'+alpha+')';ctx.fillText(c.chars[j%c.chars.length],c.x+cell/2,y)}
 if(!reduced&&Math.random()<.025)c.chars[Math.floor(rnd(c.chars.length))]=alphabet[Math.floor(rnd(alphabet.length))];
 }
 // The slogan is rasterized once to a grid-aligned outline. Each lit cell is one rain glyph.
 ctx.font='700 '+Math.floor(cell*.88)+'px monospace';
 for(let i=0;i<(plain?0:outline.length);i++){const g=outline[i];const visibility=Math.sin(g.x*.35+g.y*.19)*.18+.82;if(reveal*visibility<Math.random()*.16)continue;
 ctx.fillStyle=light?'rgba(13,91,73,'+(reveal*.85)+')':'rgba(173,255,215,'+(reveal*(.82+.18*Math.sin(elapsed*1.4+g.phase)))+')';
 ctx.fillText(g.char,(g.x+.5)*cell,(g.y+.5)*cell);
 if(!reduced&&Math.random()<.0008)g.char=alphabet[Math.floor(rnd(alphabet.length))];
 }
 // Small Russian captions occupy exactly one glyph cell per Cyrillic character.
 ctx.font='600 '+Math.floor(cell*.88)+'px monospace';ctx.fillStyle=light?'rgba(17,85,69,.95)':'rgba(185,247,212,.9)';
 for(const t of (plain?[]:smallText))ctx.fillText(t.char,(t.x+.5)*cell,(t.y+.5)*cell);
}
window.addEventListener('resize',resize,{passive:true});resize();requestAnimationFrame(render);
})();
</script></body></html>
