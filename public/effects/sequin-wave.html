<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sequin Wave</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .label {
    position: fixed;
    top: 20px;
    left: 24px;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(200, 149, 108, 0.5);
    z-index: 10;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<div class="label">Sequin Wave</div>
<canvas id="canvas"></canvas>
<script>
// ─────────────────────────────────────────────
// Sequin Wave — Thousands of tiny reflective discs catching cascading light
// ─────────────────────────────────────────────
(function() {
  var canvas = document.getElementById('canvas');
  // CODE_M: adaptive device profile, light/dark appearance, reduced motion.
  var cmQuery = new URLSearchParams(location.search);
  var cmLight = cmQuery.get('theme') === 'light';
  var cmQuality = Math.max(0.45, Math.min(1, Number(cmQuery.get('quality')) || 1));
  var cmFps = Math.max(15, Math.min(60, Number(cmQuery.get('fps')) || 60));
  var cmLastFrame = -1;
  document.documentElement.style.background = cmLight ? '#f3f2ed' : '#0a0a0a';
  document.body.style.background = cmLight ? '#f3f2ed' : '#0a0a0a';
  canvas.style.filter = 'none';
  var cmPalette = cmQuery.get('palette') || 'emerald';
  document.querySelector('.label')?.remove();

  var paletteSets = {
    emerald: {gap:[0.84,0.91,0.88],dark:[0.40,0.54,0.48],mid:[0.12,0.51,0.40],flash:[0.42,0.86,0.70],peak:[0.83,0.97,0.91]},
    ice: {gap:[0.88,0.92,0.97],dark:[0.45,0.57,0.69],mid:[0.26,0.51,0.79],flash:[0.59,0.79,0.97],peak:[0.92,0.97,1.0]},
    amethyst: {gap:[0.93,0.89,0.95],dark:[0.59,0.48,0.64],mid:[0.57,0.35,0.72],flash:[0.81,0.65,0.93],peak:[0.97,0.92,1.0]},
    gold: {gap:[0.94,0.89,0.78],dark:[0.53,0.39,0.20],mid:[0.73,0.48,0.14],flash:[0.96,0.75,0.33],peak:[1.0,0.94,0.70]},
    silver: {gap:[0.83,0.85,0.87],dark:[0.38,0.43,0.48],mid:[0.60,0.65,0.69],flash:[0.87,0.91,0.94],peak:[1.0,1.0,1.0]},
    graphite: {gap:[0.014,0.024,0.025],dark:[0.06,0.10,0.11],mid:[0.32,0.48,0.51],flash:[0.65,0.83,0.85],peak:[0.92,0.98,0.98]}
  };
  var palette = cmLight ? (paletteSets[cmPalette] || paletteSets.emerald) : paletteSets.graphite;
  document.documentElement.style.background = cmLight ? '#f2f4ed' : '#06100d';
  document.body.style.background = cmLight ? '#f2f4ed' : '#06100d';
  var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var gl = canvas.getContext('webgl', { alpha: false, antialias: false, preserveDrawingBuffer: false });
  if (!gl) return;

  // ── Tunable parameters ──
  var WAVE_SPEED = 0.8;
  var SPARKLE_INTENSITY = 1.0;

  // ── Shaders ──
  var vertSrc = [
    'attribute vec2 a_pos;',
    'void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }'
  ].join('\n');

  var fragSrc = [
    'precision highp float;',
    '',
    'uniform float u_time;',
    'uniform vec2 u_res;',
    'uniform float u_waveSpeed;',
    'uniform float u_sparkle;',
    'uniform vec2 u_mouse;',
    'uniform vec3 u_gap;',
    'uniform vec3 u_dark;',
    'uniform vec3 u_mid;',
    'uniform vec3 u_flash;',
    'uniform vec3 u_peak;',
    'uniform float u_lightTheme;',
    '',
    '#define PI 3.14159265359',
    '#define TAU 6.28318530718',
    '#define SQRT3 1.7320508',
    '',
    '// ── Hash functions for per-sequin variation ──',
    'float hash21(vec2 p) {',
    '  p = fract(p * vec2(233.34, 851.73));',
    '  p += dot(p, p + 23.45);',
    '  return fract(p.x * p.y);',
    '}',
    '',
    'vec2 hash22(vec2 p) {',
    '  float n = hash21(p);',
    '  return vec2(n, hash21(p + n * 47.0));',
    '}',
    '',
    '// ── Hexagonal tiling ──',
    '// Returns: xy = local coords within hex cell, zw = cell ID',
    'vec4 hexTile(vec2 p, float scale) {',
    '  p *= scale;',
    '  // Two candidate grids offset by half a cell',
    '  vec2 s = vec2(1.0, SQRT3);',
    '  vec2 halfS = s * 0.5;',
    '',
    '  // Grid A',
    '  vec2 aBase = floor(p / s);',
    '  vec2 aLocal = mod(p, s) - halfS;',
    '',
    '  // Grid B (offset)',
    '  vec2 pOff = p - halfS;',
    '  vec2 bBase = floor(pOff / s);',
    '  vec2 bLocal = mod(pOff, s) - halfS;',
    '',
    '  // Pick nearest center',
    '  float dA = dot(aLocal, aLocal);',
    '  float dB = dot(bLocal, bLocal);',
    '',
    '  // Use step to avoid branching',
    '  float pick = step(dA, dB);',
    '  vec2 localCoord = mix(bLocal, aLocal, pick);',
    '  vec2 cellId = mix(bBase + vec2(0.5), aBase, pick);',
    '',
    '  return vec4(localCoord, cellId);',
    '}',
    '',
    '// ── Wave field: multiple interfering wave sources ──',
    'float waveField(vec2 cellPos, float t) {',
    '  float w = 0.0;',
    '',
    '  // Wave 1: diagonal sweep',
    '  w += sin(dot(cellPos, vec2(0.7, 0.5)) * 3.5 - t * 2.8) * 0.35;',
    '',
    '  // Wave 2: horizontal ripple',
    '  w += sin(cellPos.x * 4.2 + t * 1.9) * 0.25;',
    '',
    '  // Wave 3: radial pulse from offset center',
    '  float r1 = length(cellPos - vec2(-0.3, 0.2));',
    '  w += sin(r1 * 6.0 - t * 3.2) * 0.2 * smoothstep(1.2, 0.0, r1);',
    '',
    '  // Wave 4: slower diagonal from opposite direction',
    '  w += sin(dot(cellPos, vec2(-0.4, 0.8)) * 2.8 - t * 1.5) * 0.2;',
    '',
    '  // Wave 5: secondary radial from other side',
    '  float r2 = length(cellPos - vec2(0.4, -0.3));',
    '  w += sin(r2 * 5.0 - t * 2.4) * 0.15 * smoothstep(1.0, 0.0, r2);',
    '',
    '  return w;',
    '}',
    '',
    '// ── Specular calculation for a tilted sequin disc ──',
    '// tiltAngle: how much the sequin is tilted by the wave',
    '// tiltDir: direction of the tilt (2D angle)',
    '// Returns specular intensity',
    'float sequinSpecular(float tiltAngle, float tiltDir, vec2 uv) {',
    '  // Sequin normal: starts as (0,0,1), tilted by wave',
    '  float ct = cos(tiltAngle);',
    '  float st = sin(tiltAngle);',
    '  float cd = cos(tiltDir);',
    '  float sd = sin(tiltDir);',
    '',
    '  // Normal of tilted disc',
    '  vec3 N = vec3(st * cd, st * sd, ct);',
    '',
    '  // Light direction (from upper-right, slightly behind camera)',
    '  vec3 L = normalize(vec3(0.4, 0.6, 0.9));',
    '',
    '  // View direction (straight on)',
    '  vec3 V = vec3(0.0, 0.0, 1.0);',
    '',
    '  // Reflection of light off sequin surface',
    '  vec3 R = reflect(-L, N);',
    '',
    '  // Specular: how well reflection aligns with view',
    '  float spec = max(dot(R, V), 0.0);',
    '',
    '  // Very tight specular for mirror-like sequins',
    '  spec = pow(spec, 48.0);',
    '',
    '  // Secondary broader highlight for ambient sheen',
    '  float sheen = pow(max(dot(R, V), 0.0), 8.0) * 0.15;',
    '',
    '  return spec + sheen;',
    '}',
    '',
    'void main() {',
    '  vec2 uv = (gl_FragCoord.xy - u_res * 0.5) / min(u_res.x, u_res.y);',
    '  float t = u_time * u_waveSpeed;',
    '',
    '  // ── Hexagonal grid of sequins ──',
    '  float sequinScale = 38.0; // density of sequins',
    '  vec4 hex = hexTile(uv, sequinScale);',
    '  vec2 localPos = hex.xy;  // position within cell',
    '  vec2 cellId = hex.zw;    // which cell',
    '',
    '  // ── Per-sequin random variation ──',
    '  vec2 rnd = hash22(cellId);',
    '  float sizeVar = 0.85 + rnd.x * 0.3;       // size variation',
    '  float baseTilt = (rnd.y - 0.5) * 0.15;     // resting tilt offset',
    '  float reflVar = 0.7 + rnd.x * 0.3;         // reflectivity variation',
    '  float phaseOff = rnd.y * TAU;               // phase offset for shimmer',
    '',
    '  // ── Sequin disc shape ──',
    '  float discRadius = 0.42 * sizeVar;',
    '  float dist = length(localPos);',
    '  float disc = smoothstep(discRadius, discRadius - 0.06, dist);',
    '',
    '  // Subtle edge bevel highlight',
    '  float bevel = smoothstep(discRadius, discRadius - 0.04, dist)',
    '              - smoothstep(discRadius - 0.04, discRadius - 0.08, dist);',
    '',
    '  // ── World position of this sequin (for wave sampling) ──',
    '  vec2 worldPos = cellId / sequinScale;',
    '',
    '  // ── Wave-driven tilt ──',
    '  float wave = waveField(worldPos, t);',
    '',
    '  // Add subtle individual shimmer',
    '  float shimmer = sin(t * 3.0 + phaseOff) * 0.04;',
    '',
    '  // Tilt angle from wave + individual variation',
    '  float tiltAngle = wave * 0.85 + baseTilt + shimmer;',
    '',
    '  // Tilt direction: follows the wave gradient',
    '  // Approximate gradient with offset samples',
    '  float waveH = waveField(worldPos + vec2(0.01, 0.0), t);',
    '  float waveV = waveField(worldPos + vec2(0.0, 0.01), t);',
    '  float tiltDir = atan(waveV - wave, waveH - wave);',
    '',
    '  // ── Mouse light source: extra specular from cursor ──',
    '  float mouseSpec = 0.0;',
    '  if (u_mouse.x > 0.0) {',
    '    vec2 mUV = (u_mouse - u_res * 0.5) / min(u_res.x, u_res.y);',
    '    float mDist = length(worldPos - mUV);',
    '    float mInfluence = exp(-mDist * mDist * 6.0);',
    '    // Light from mouse position',
    '    vec3 mLightDir = normalize(vec3(mUV.x - worldPos.x, mUV.y - worldPos.y, 0.5));',
    '    float ct = cos(tiltAngle);',
    '    float st2 = sin(tiltAngle);',
    '    float cd = cos(tiltDir);',
    '    float sd = sin(tiltDir);',
    '    vec3 mN = vec3(st2 * cd, st2 * sd, ct);',
    '    vec3 mR = reflect(-mLightDir, mN);',
    '    float mS = pow(max(dot(mR, vec3(0.0, 0.0, 1.0)), 0.0), 32.0);',
    '    mouseSpec = mS * mInfluence * 1.5;',
    '  }',
    '',
    '  // ── Specular flash ──',
    '  float spec = sequinSpecular(tiltAngle, tiltDir, uv);',
    '  spec *= reflVar * u_sparkle;',
    '  spec += mouseSpec * reflVar;',
    '',
    '  // ── Color composition ──',
    '  // Dark base: sequin that is tilted away from light',
    '  vec3 darkSequin = u_dark;',
    '',
    '  // Mid-tone: ambient copper reflection',
    '  vec3 copperMid = u_mid;',
    '',
    '  // Bright flash: hot amber/gold when specular aligns',
    '  vec3 amberFlash = u_flash;',
    '',
    '  // Hot white-gold for peak brightness',
    '  vec3 hotGold = u_peak;',
    '',
    '  // Base sequin color depends on tilt (how much it faces camera)',
    '  float facing = cos(tiltAngle) * 0.5 + 0.5;',
    '  facing = clamp(facing, 0.0, 1.0);',
    '',
    '  // Warm ambient: even dark sequins have a hint of warmth',
    '  vec3 ambient = mix(darkSequin, u_mid * (u_lightTheme > 0.5 ? 0.32 : 0.13), facing * 0.6);',
    '',
    '  // Build up the specular flash in layers',
    '  vec3 sequinColor = ambient;',
    '',
    '  // Broad warm sheen',
    '  float sheenAmount = pow(max(facing, 0.0), 3.0) * mix(0.2,0.09,u_lightTheme) * reflVar;',
    '  sequinColor += copperMid * sheenAmount;',
    '',
    '  // Specular flash',
    '  float flashLow = smoothstep(0.0, 0.3, spec);',
    '  float flashHigh = smoothstep(0.3, 0.8, spec);',
    '  float flashPeak = smoothstep(0.7, 1.0, spec);',
    '  sequinColor += copperMid * flashLow * 0.5;',
    '  sequinColor += amberFlash * flashHigh * mix(0.8,0.22,u_lightTheme);',
    '  sequinColor += hotGold * flashPeak * mix(1.2,0.25,u_lightTheme);',
    '',
    '  // Bevel edge catches light differently',
    '  sequinColor += copperMid * bevel * facing * 0.3;',
    '',
    '  // ── Background between sequins ──',
    '  // Dark gap with very subtle warm tone',
    '  vec3 bgColor = u_gap;',
    '',
    '  // ── Final mix: disc mask selects sequin vs gap ──',
    '  vec3 col = mix(bgColor, sequinColor, disc);',
    '',
    '  // ── Global lighting: subtle gradient from light direction ──',
    '  vec2 uvSafe = uv + vec2(0.0001);',
    '  float globalLight = 0.85 + 0.15 * dot(normalize(uvSafe), vec2(0.4, 0.6));',
    '  col *= globalLight;',
    '',
    '  // ── Vignette ──',
    '  float vig = 1.0 - smoothstep(0.4, 1.3, length(uv));',
    '  col *= mix(0.88, 1.0, vig) * u_lightTheme + (0.6 + 0.4 * vig) * (1.0 - u_lightTheme);',
    '',
    '  // ── Warm gamma correction ──',
    '  col = pow(max(col, vec3(0.0)), vec3(0.93, 0.97, 1.04));',
    '',
    '  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);',
    '}',
  ].join('\n');

  // ── Compile & link ──
  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error('Shader compile error:', gl.getShaderInfoLog(s));
    }
    return s;
  }

  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vertSrc));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(prog));
  }
  gl.useProgram(prog);

  // Fullscreen triangle
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var aPos = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  // Uniforms
  var uTime = gl.getUniformLocation(prog, 'u_time');
  var uRes = gl.getUniformLocation(prog, 'u_res');
  var uWaveSpeed = gl.getUniformLocation(prog, 'u_waveSpeed');
  var uSparkle = gl.getUniformLocation(prog, 'u_sparkle');
  var uMouse = gl.getUniformLocation(prog, 'u_mouse');
  function setColor(name, rgb){gl.uniform3fv(gl.getUniformLocation(prog,name),new Float32Array(rgb));}
  setColor('u_gap',palette.gap);setColor('u_dark',palette.dark);setColor('u_mid',palette.mid);setColor('u_flash',palette.flash);setColor('u_peak',palette.peak);
  gl.uniform1f(gl.getUniformLocation(prog,'u_lightTheme'),cmLight?1:0);

  var mouseXVal = -1.0, mouseYVal = -1.0;

  canvas.addEventListener('mousemove', function(e) {
    mouseXVal = e.clientX * dpr;
    mouseYVal = (canvas.clientHeight - e.clientY) * dpr;
  });
  canvas.addEventListener('mouseleave', function() {
    mouseXVal = -1.0; mouseYVal = -1.0;
  });
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var touch = e.touches[0];
    mouseXVal = touch.clientX * dpr;
    mouseYVal = (canvas.clientHeight - touch.clientY) * dpr;
  }, { passive: false });
  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    var touch = e.touches[0];
    mouseXVal = touch.clientX * dpr;
    mouseYVal = (canvas.clientHeight - touch.clientY) * dpr;
  }, { passive: false });
  canvas.addEventListener('touchend', function() {
    mouseXVal = -1.0; mouseYVal = -1.0;
  });

  var dpr = Math.min(window.devicePixelRatio || 1, 2) * cmQuality;
  var needsResize = true;

  // ── Resize ──
  function resize() {
    needsResize = false;
    var w = Math.round(canvas.clientWidth * dpr);
    var h = Math.round(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
      gl.uniform2f(uRes, canvas.width, canvas.height);
    }
  }

  // ── Animation ──
  var lastTime = 0;
  var paused = false;

  function render(now) {
    if (cmLastFrame >= 0 && now - cmLastFrame < 1000 / cmFps - 1) { requestAnimationFrame(render); return; }
    cmLastFrame = now;
    if (paused) {
      requestAnimationFrame(render);
      return;
    }

    if (lastTime === 0) lastTime = now;
    lastTime = now;
    if (needsResize) resize();

    gl.uniform1f(uTime, prefersReduced ? 0.0 : now * 0.001);
    gl.uniform1f(uWaveSpeed, WAVE_SPEED);
    gl.uniform1f(uSparkle, SPARKLE_INTENSITY);
    gl.uniform2f(uMouse, mouseXVal, mouseYVal);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(render);
  }

  window.addEventListener('resize', function () {
    needsResize = true;
  });

  resize();

  requestAnimationFrame(render);

  // ── Visibility pause ──
  document.addEventListener('visibilitychange', function() {
    paused = document.hidden;
    if (!paused) lastTime = 0;
  });

  window.addEventListener('message',function(e){if(e.source!==parent)return;if(e.data&&e.data.type==='cm-gesture'){mouseXVal=e.data.x<0?-1:e.data.x*dpr;mouseYVal=e.data.y<0?-1:(canvas.clientHeight-e.data.y)*dpr;}});
  // ── PostMessage API ──
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'param') {
      switch (e.data.name) {
        case 'WAVE_SPEED': WAVE_SPEED = e.data.value; break;
        case 'SPARKLE_INTENSITY': SPARKLE_INTENSITY = e.data.value; break;
      }
    }
  });
})();
</script>
</body>
</html>
